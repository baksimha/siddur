plugins { id 'com.android.application' }
android {
    namespace 'com.baksimha.siddur'
    compileSdk 34
    defaultConfig {
        applicationId 'com.baksimha.siddur'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }
    // One fixed signing key, so every new build installs as an update over the previous one
    signingConfigs {
        fixed {
            storeFile file('siddur.keystore')
            storePassword 'siddur123'
            keyAlias 'siddur'
            keyPassword 'siddur123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
